<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background tile 3D gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Bevel highlight -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </linearGradient>

    <!-- Sheet top gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Gold badge gradient -->
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Folded corner gradient -->
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.65" />
    </filter>

    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Base 3D Tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tileGrad)" filter="url(#dropShadow)" />
  <rect x="18" y="18" width="220" height="220" rx="50" fill="none" stroke="url(#bevelGrad)" stroke-width="3" />

  <!-- 2. Back Sheet (Offset 3D layer) -->
  <g filter="url(#sheetShadow)">
    <rect x="74" y="44" width="124" height="154" rx="8" fill="#94a3b8" opacity="0.6" transform="rotate(6 136 121)" />
  </g>

  <!-- 3. Middle Sheet -->
  <g filter="url(#sheetShadow)">
    <rect x="66" y="48" width="124" height="154" rx="8" fill="#e2e8f0" opacity="0.85" transform="rotate(-3 128 125)" />
  </g>

  <!-- 4. Front Primary Invoice Document -->
  <g filter="url(#sheetShadow)">
    <!-- Main page body with clipped fold -->
    <path d="M 68 54 L 152 54 L 188 90 L 188 202 A 8 8 0 0 1 180 210 L 68 210 A 8 8 0 0 1 60 202 L 60 62 A 8 8 0 0 1 68 54 Z" fill="url(#sheetGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 152 54 L 152 86 A 4 4 0 0 0 156 90 L 188 90 Z" fill="url(#cornerGrad)" />
    <path d="M 152 90 L 188 90" stroke="#64748b" stroke-width="0.5" opacity="0.4" />

    <!-- Invoice Header Brand Accent Strip -->
    <rect x="72" y="68" width="70" height="7" rx="3.5" fill="#2563eb" />
    <rect x="72" y="81" width="46" height="4" rx="2" fill="#94a3b8" />

    <!-- Invoice Divider Line -->
    <line x1="72" y1="94" x2="176" y2="94" stroke="#e2e8f0" stroke-width="2" />

    <!-- Invoice Table / Data Rows -->
    <rect x="72" y="104" width="104" height="6" rx="2" fill="#cbd5e1" />
    <rect x="72" y="116" width="80" height="5" rx="2" fill="#e2e8f0" />
    <rect x="72" y="126" width="94" height="5" rx="2" fill="#e2e8f0" />
    <rect x="72" y="136" width="70" height="5" rx="2" fill="#e2e8f0" />

    <!-- Barcode Representation at bottom -->
    <g transform="translate(72, 154)">
      <rect x="0" y="0" width="3" height="26" fill="#1e293b" />
      <rect x="5" y="0" width="1.5" height="26" fill="#1e293b" />
      <rect x="8" y="0" width="4" height="26" fill="#1e293b" />
      <rect x="14" y="0" width="2" height="26" fill="#1e293b" />
      <rect x="18" y="0" width="3.5" height="26" fill="#1e293b" />
      <rect x="23" y="0" width="1" height="26" fill="#1e293b" />
      <rect x="26" y="0" width="4" height="26" fill="#1e293b" />
      <rect x="32" y="0" width="2" height="26" fill="#1e293b" />
      <rect x="36" y="0" width="3" height="26" fill="#1e293b" />
      <rect x="41" y="0" width="1.5" height="26" fill="#1e293b" />
      <rect x="44" y="0" width="4" height="26" fill="#1e293b" />
      <rect x="50" y="0" width="2.5" height="26" fill="#1e293b" />
    </g>

    <!-- Total Amount Block -->
    <rect x="132" y="156" width="44" height="22" rx="4" fill="#0f172a" />
    <text x="154" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">₹ BILL</text>

    <!-- 5. 3D Golden Verification Seal Badge -->
    <g transform="translate(162, 184)">
      <circle cx="16" cy="16" r="22" fill="url(#goldBadge)" stroke="#fef08a" stroke-width="2" filter="url(#sheetShadow)" />
      <!-- Inner star / checkmark -->
      <path d="M 9 16 L 14 21 L 24 10" fill="none" stroke="#713f12" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
