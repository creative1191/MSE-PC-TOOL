<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Rich Deep Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2447" />
      <stop offset="50%" stop-color="#071b33" />
      <stop offset="100%" stop-color="#030c17" />
    </linearGradient>

    <!-- Vibrant Gold Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Speed Wing Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base for High Tab Visibility -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Speed Motion Wings (Express Delivery) -->
  <path d="M 16 38 L 44 38 L 34 50 L 16 50 Z" fill="url(#cyanGrad)" opacity="0.9" />
  <path d="M 22 55 L 50 55 L 40 67 L 22 67 Z" fill="url(#cyanGrad)" opacity="0.7" />
  <path d="M 28 72 L 56 72 L 46 84 L 28 84 Z" fill="url(#cyanGrad)" opacity="0.5" />

  <!-- 3D Isometric Courier Parcel Box -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="76,24 104,38 76,52 48,38" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.2" />
    <!-- Left Face -->
    <polygon points="48,38 76,52 76,82 48,68" fill="#ca8a04" stroke="#eab308" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="76,52 104,38 104,68 76,82" fill="#a16207" stroke="#eab308" stroke-width="1" />

    <!-- Package Tape -->
    <polygon points="73,26 79,29 79,81 73,78" fill="#0b2447" opacity="0.4" />
    <polygon points="58,33 64,36 94,51 88,48" fill="#0b2447" opacity="0.3" />
  </g>

  <!-- Golden 5-Star Quality Badge -->
  <g transform="translate(98, 20) scale(0.65)">
    <polygon points="12,2 15,9 23,10 17,16 19,23 12,19 5,23 7,16 1,10 9,9" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
  </g>

  <!-- MSE Brand Text in high contrast bold white/gold -->
  <text x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle" filter="url(#glow)">
    MSE
  </text>
  <text x="64" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing="1" text-anchor="middle">
    COURIER HUB
  </text>
</svg>
